name: Release

# Push a tag like v1.0.0-rc1 or v1.0.0 to build and publish a release (ADR-0014).
# Tags with "-" are pre-releases and appear in the experimental channel only.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ github.ref_name }}
      with-installer: true
    secrets: inherit

  publish:
    needs: build
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ZoomIN ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
