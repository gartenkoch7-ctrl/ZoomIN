name: Develop pre-release

# Every push to develop becomes an experimental pre-release v<VERSION>-dev.<N> (ADR-0014).
# N is the commit count, so it only grows and orders correctly (1.0.0-dev.9 < 1.0.0-dev.10).
on:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: develop-prerelease
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)-dev.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    needs: [version, build]
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ZoomIN ${{ needs.version.outputs.version }} (experimentell)
          body: |
            Automatischer Build von `develop` (${{ github.sha }}). Experimentell, nicht getestet.
            Automatic build of `develop`. Experimental, untested.
          prerelease: true
          files: artifacts/*
