name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check file length (max 300 lines)
        shell: pwsh
        run: ./scripts/check-file-length.ps1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ZoomIN.slnx -c Release

      - name: Test
        run: dotnet test --solution ZoomIN.slnx -c Release --no-build
